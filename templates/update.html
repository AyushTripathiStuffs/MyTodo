{% extends 'base.html' %}
{% block title %}Edit{% endblock title %}
{% block body %}
<div class="container my-3">
    <h2><u>Edit your Todo</u></h2>
    <form action="/update/{{todo.sno}}" method="POST">
        <div class="mb-3">
            <label for="title" class="form-label">Todo Title</label>
            <input type="text" class="form-control" name="title" id="title" value="{{todo.title}}" aria-describedby="title">
        </div>
        <div class="mb-3">
            <label for="desc" class="form-label">Todo Description</label>
            <input type="text" class="form-control" name="desc" id="desc" value="{{todo.description}}">
        </div>
        <button type="submit" class="btn btn-dark">Update Todo</button>
    </form>
</div>
{% endblock body %}
